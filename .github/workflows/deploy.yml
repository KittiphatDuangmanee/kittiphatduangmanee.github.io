name: Deploy to GitHub Pages

# Builds the static site and publishes dist/ to GitHub Pages.
# One time setup: repository Settings, Pages, Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, lint, content structure and asset integrity. The two design
      # gates skip themselves here because the skill is not installed on CI.
      - run: npm run check
      - run: npm run build
      # Every asset the data layer references must have made it into dist/.
      - run: node scripts/verify-assets.ts dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
